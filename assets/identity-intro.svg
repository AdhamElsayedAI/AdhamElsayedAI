<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="t d">
<title id="t">Adham Elsayed — animated AI engineer identity</title>
<desc id="d">Adham Elsayed's uploaded portrait enters over a layered depth frame, followed by a custom name reveal and engineering focus.</desc>
<defs>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#58a6ff"/><stop offset=".52" stop-color="#8b5cf6"/><stop offset="1" stop-color="#2ea043"/>
  </linearGradient>
  <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1b2430"/><stop offset=".55" stop-color="#111820"/><stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#58a6ff" stop-opacity=".22"/><stop offset=".55" stop-color="#8b5cf6" stop-opacity=".08"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-60%" y="-60%" width="220%" height="240%"><feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000" flood-opacity=".58"/></filter>
  <clipPath id="photo"><rect x="449" y="34" width="222" height="222" rx="38"/></clipPath>
  <clipPath id="nameReveal"><rect x="160" y="286" width="0" height="88"><animate attributeName="width" values="0;800" dur="1.05s" begin=".72s" fill="freeze"/></rect></clipPath>
</defs>
<ellipse cx="560" cy="154" rx="190" ry="108" fill="url(#halo)" opacity=".78"><animate attributeName="opacity" values=".45;.82;.45" dur="6.4s" repeatCount="indefinite"/></ellipse>
<g opacity="0">
  <animate attributeName="opacity" values="0;1" dur=".48s" begin=".08s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" values="0 -30;0 0" dur=".82s" begin=".08s" fill="freeze"/>
  <rect x="425" y="20" width="270" height="250" rx="48" fill="#090d12" stroke="#21262d" transform="rotate(-5 560 145)"/>
  <rect x="434" y="26" width="252" height="238" rx="44" fill="#111820" stroke="#30363d" transform="rotate(4 560 145)">
    <animateTransform attributeName="transform" type="rotate" values="4 560 145;1.5 560 145;4 560 145" dur="7.2s" begin=".95s" repeatCount="indefinite"/>
  </rect>
  <rect x="442" y="31" width="236" height="228" rx="42" fill="url(#plate)" stroke="url(#rim)" stroke-width="2" stroke-opacity=".72" transform="rotate(-1.8 560 145)">
    <animateTransform attributeName="transform" type="rotate" values="-1.8 560 145;.7 560 145;-1.8 560 145" dur="7.2s" begin=".95s" repeatCount="indefinite"/>
  </rect>
</g>
<g opacity="0" filter="url(#shadow)">
  <animate attributeName="opacity" values="0;1" dur=".58s" begin=".16s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" values="0 -42;0 0;0 -4;0 0" keyTimes="0;.55;.78;1" dur="1.2s" begin=".16s" fill="freeze"/>
  <rect x="447" y="32" width="226" height="226" rx="40" fill="#f7f7f7" stroke="#ffffff" stroke-opacity=".14"/>
  <image href="data:image/jpeg;base64," x="449" y="34" width="222" height="222" preserveAspectRatio="xMidYMid slice" clip-path="url(#photo)"/>
  <rect x="449" y="34" width="222" height="222" rx="38" fill="none" stroke="#ffffff" stroke-opacity=".16"/>
  <animateTransform attributeName="transform" additive="sum" type="translate" values="0 0;0 -3;0 0" dur="6.2s" begin="1.35s" repeatCount="indefinite"/>
</g>
<g clip-path="url(#nameReveal)">
  <text x="560" y="348" text-anchor="middle" fill="#f0f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="62" font-weight="800" letter-spacing="15">ADHAM ELSAYED<animate attributeName="letter-spacing" values="15;4" dur="1.05s" begin=".72s" fill="freeze"/></text>
</g>
<rect x="560" y="368" width="0" height="3" rx="2" fill="url(#rim)"><animate attributeName="x" values="560;392" dur=".7s" begin="1.38s" fill="freeze"/><animate attributeName="width" values="0;336" dur=".7s" begin="1.38s" fill="freeze"/></rect>
<g opacity="0"><animate attributeName="opacity" values="0;1" dur=".55s" begin="1.62s" fill="freeze"/><text x="560" y="408" text-anchor="middle" fill="#58a6ff" font-family="JetBrains Mono,Consolas,monospace" font-size="21" font-weight="700" letter-spacing="4">AI ENGINEER</text><text x="560" y="439" text-anchor="middle" fill="#8b949e" font-family="JetBrains Mono,Consolas,monospace" font-size="15">Computer Vision · RAG / LLM Systems · Edge AI · Evaluation</text></g>
<circle r="4.5" fill="#58a6ff" opacity=".85"><animateMotion dur="5.8s" begin="2.1s" repeatCount="indefinite" path="M392 369 H728"/><animate attributeName="opacity" values=".2;1;.2" dur="1.4s" repeatCount="indefinite"/></circle>
</svg>