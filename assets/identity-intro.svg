<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="185" viewBox="0 0 1120 185" role="img" aria-labelledby="t d">
<title id="t">Adham Elsayed — AI Engineer</title>
<desc id="d">A restrained macOS-inspired glass identity strip with a subtle animated name reveal.</desc>
<defs>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".075"/>
    <stop offset=".45" stop-color="#ffffff" stop-opacity=".025"/>
    <stop offset="1" stop-color="#58a6ff" stop-opacity=".045"/>
  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
    <stop offset=".5" stop-color="#58a6ff" stop-opacity=".8"/>
    <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-40%" width="140%" height="180%">
    <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".30"/>
  </filter>
  <clipPath id="reveal"><rect x="210" y="28" width="0" height="70"><animate attributeName="width" values="0;700" dur=".95s" begin=".25s" fill="freeze"/></rect></clipPath>
</defs>
<g opacity="0" filter="url(#shadow)">
  <animate attributeName="opacity" values="0;1" dur=".5s" begin=".05s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" values="0 8;0 0" dur=".65s" begin=".05s" fill="freeze"/>
  <rect x="154" y="10" width="812" height="164" rx="28" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".10"/>
  <path d="M184 36H936" stroke="#ffffff" stroke-opacity=".055"/>
  <circle cx="184" cy="27" r="4" fill="#ff5f57" opacity=".72"/>
  <circle cx="198" cy="27" r="4" fill="#febc2e" opacity=".72"/>
  <circle cx="212" cy="27" r="4" fill="#28c840" opacity=".72"/>
</g>
<g clip-path="url(#reveal)">
  <text x="560" y="86" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="54" font-weight="720" letter-spacing="12">ADHAM ELSAYED
    <animate attributeName="letter-spacing" values="12;3.2" dur=".95s" begin=".25s" fill="freeze"/>
  </text>
</g>
<rect x="560" y="104" width="0" height="2" rx="1" fill="url(#line)">
  <animate attributeName="x" values="560;370" dur=".65s" begin=".95s" fill="freeze"/>
  <animate attributeName="width" values="0;380" dur=".65s" begin=".95s" fill="freeze"/>
</rect>
<g opacity="0">
  <animate attributeName="opacity" values="0;1" dur=".5s" begin="1.15s" fill="freeze"/>
  <text x="560" y="137" text-anchor="middle" fill="#c9d1d9" font-family="SFMono-Regular,Consolas,monospace" font-size="17" font-weight="600" letter-spacing="2.4">AI ENGINEER</text>
  <text x="560" y="160" text-anchor="middle" fill="#8b949e" font-family="SFMono-Regular,Consolas,monospace" font-size="12.5">Computer Vision · RAG / LLM Systems · Edge AI · Evaluation</text>
</g>
</svg>