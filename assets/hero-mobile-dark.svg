<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" role="img" aria-labelledby="t d">
<title id="t">Adham Elsayed — AI Engineer</title>
<desc id="d">AI systems engineer focused on generative AI, retrieval, and computer vision, with an animated retrieve, rerank, verify, serve pipeline.</desc>
<style>
.sans{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes drift{to{transform:translate(24px,24px)}}
@keyframes sweep{from{transform:translateX(-260px)}to{transform:translateX(1460px)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes cyc{0%{opacity:0;transform:translateY(8px)}4%,29%{opacity:1;transform:none}33%,100%{opacity:0;transform:translateY(-6px)}}
@keyframes ind{0%{opacity:0}4%,29%{opacity:1}33%,100%{opacity:0}}
@keyframes h0{0%{opacity:0}4%,20%{opacity:1}28%,100%{opacity:0}}
@keyframes h1{0%,22%{opacity:0}30%,46%{opacity:1}54%,100%{opacity:0}}
@keyframes h2{0%,48%{opacity:0}56%,70%{opacity:1}78%,100%{opacity:0}}
@keyframes h3{0%,74%{opacity:0}82%,94%{opacity:1}100%{opacity:0}}
@keyframes pkt{0%{opacity:0;transform:translateX(0)}4%{opacity:1}92%{opacity:1}100%{opacity:0;transform:translateX(552)}}
@keyframes bar{0%{stroke-dashoffset:552;opacity:1}92%{opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes cur{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes ring{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.8);opacity:0}}
.grid{animation:drift 12s linear infinite}
.sw{animation:sweep 9s linear infinite}
.in1{animation:rise .8s ease-out both}
.in2{animation:rise .8s ease-out .12s both}
.in3{animation:rise .8s ease-out .4s both}
.in4{animation:rise .9s ease-out .3s both}
.r{opacity:0}.r1{opacity:1;animation:cyc 12s ease-in-out infinite both}
.r2{animation:cyc 12s ease-in-out 4s infinite both}.r3{animation:cyc 12s ease-in-out 8s infinite both}
.i{opacity:0}.i1{animation:ind 12s infinite both}.i2{animation:ind 12s 4s infinite both}.i3{animation:ind 12s 8s infinite both}
.hl{opacity:0}
.h0{animation:h0 6s linear infinite}.h1{animation:h1 6s linear infinite}
.h2{animation:h2 6s linear infinite}.h3{animation:h3 6s linear infinite}
.pkt{opacity:0;animation:pkt 6s linear infinite}
.bar{stroke-dasharray:552;stroke-dashoffset:0;opacity:.55;animation:bar 6s linear infinite}
.cur{animation:cur 1.1s steps(1,end) infinite}
.glow{animation:glow 6s ease-in-out infinite}
.dot{animation:pulse 2.4s ease-in-out infinite}
.ring{opacity:0;transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#191B1F"/><stop offset="1" stop-color="#111316"/></linearGradient>
 <linearGradient id="sg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#E66B55" stop-opacity="0"/><stop offset=".5" stop-color="#F28A60"/><stop offset="1" stop-color="#E66B55" stop-opacity="0"/></linearGradient>
 <radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop stop-color="#E66B55" stop-opacity=".16"/><stop offset="1" stop-color="#E66B55" stop-opacity="0"/></radialGradient>
 <pattern id="gp" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#FFFFFF" stroke-opacity=".04"/></pattern>
 <clipPath id="cc"><rect x="1" y="1" width="598" height="438" rx="14"/></clipPath>
 <clipPath id="pc"><rect x="0" y="0" width="1" height="1" rx="9"/></clipPath>
</defs>
<rect x="1" y="1" width="598" height="438" rx="14" fill="url(#bg)" stroke="#36393F" stroke-width="2"/>
<g clip-path="url(#cc)">
 <rect class="grid" x="-24" y="-24" width="648" height="488" fill="url(#gp)"/>
 <ellipse class="glow" cx="300" cy="330" rx="330" ry="170" fill="url(#gl)"/>
 <rect class="sw" x="0" y="52" width="260" height="2" fill="url(#sg)"/>
</g>
<path d="M18 53H582" stroke="#FFFFFF" stroke-opacity=".13"/>
<rect x="24" y="16" width="30" height="23" rx="3" fill="#E66B55"/>
<text x="39" y="32" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#111316">AE</text>
<text x="66" y="32" class="mono" font-size="12" letter-spacing="1.4" fill="#E1DED9">ADHAM / ENGINEERING</text>
<circle class="ring" cx="566" cy="28" r="4" fill="#E66B55"/><circle class="dot" cx="566" cy="28" r="4" fill="#E66B55"/>

<text class="mono in1" x="25" y="94" font-size="13" font-weight="600" letter-spacing="2" fill="#F28A60">/  AI SYSTEMS ENGINEER</text>
<text class="sans in2" x="22" y="154" font-size="54" font-weight="750" letter-spacing="-2.2" fill="#F4F1ED">Adham Elsayed<tspan fill="#E66B55">.</tspan></text>
<g class="sans" font-size="20" font-weight="500" fill="#E1DED9">
 <text class="r r1" x="24" y="196">Generative AI <tspan fill="#6F757A">/</tspan> RAG <tspan fill="#6F757A">/</tspan> Computer Vision</text>
 <text class="r r2" x="24" y="196">Hybrid retrieval <tspan fill="#6F757A">·</tspan> reranking <tspan fill="#6F757A">·</tspan> grounding</text>
 <text class="r r3" x="24" y="196">FastAPI <tspan fill="#6F757A">·</tspan> ONNX Runtime <tspan fill="#6F757A">·</tspan> edge deployment</text>
</g>
<g fill="#FFFFFF" fill-opacity=".18"><rect x="24" y="212" width="16" height="2"/><rect x="46" y="212" width="16" height="2"/><rect x="68" y="212" width="16" height="2"/></g>
<g fill="#E66B55"><rect class="i i1" x="24" y="212" width="16" height="2"/><rect class="i i2" x="46" y="212" width="16" height="2"/><rect class="i i3" x="68" y="212" width="16" height="2"/></g>
<g class="sans in3" font-size="16" fill="#ACAFB2"><text x="24" y="250">Building the data pipelines, model logic and APIs</text><text x="24" y="273">that make intelligent products dependable.</text></g>
<g class="in4">
 <rect x="24" y="302" width="126" height="44" rx="5" fill="#292C31" stroke="#5A5D62"/>
<rect class="hl h0" x="24" y="302" width="126" height="44" rx="5" fill="#E66B55" fill-opacity=".2" stroke="#E66B55"/>
<text x="87.0" y="328.0" text-anchor="middle" class="mono" font-size="13" letter-spacing=".6" fill="#E1DED9">RETRIEVE</text>
<rect x="166" y="302" width="126" height="44" rx="5" fill="#292C31" stroke="#5A5D62"/>
<rect class="hl h1" x="166" y="302" width="126" height="44" rx="5" fill="#E66B55" fill-opacity=".2" stroke="#E66B55"/>
<text x="229.0" y="328.0" text-anchor="middle" class="mono" font-size="13" letter-spacing=".6" fill="#E1DED9">RERANK</text>
<rect x="308" y="302" width="126" height="44" rx="5" fill="#292C31" stroke="#5A5D62"/>
<rect class="hl h2" x="308" y="302" width="126" height="44" rx="5" fill="#E66B55" fill-opacity=".2" stroke="#E66B55"/>
<text x="371.0" y="328.0" text-anchor="middle" class="mono" font-size="13" letter-spacing=".6" fill="#E1DED9">VERIFY</text>
<rect x="450" y="302" width="126" height="44" rx="5" fill="#292C31" stroke="#5A5D62"/>
<rect class="hl h3" x="450" y="302" width="126" height="44" rx="5" fill="#E66B55" fill-opacity=".2" stroke="#E66B55"/>
<text x="513.0" y="328.0" text-anchor="middle" class="mono" font-size="13" letter-spacing=".6" fill="#F28A60">SERVE</text>
 <g stroke="#E66B55" stroke-opacity=".75" fill="none" stroke-width="1.5"><path d="M150 324H166M292 324H308M434 324H450"/></g>
 <path d="M24 376H576" stroke="#5A5D62"/>
 <path class="bar" d="M24 376H576" stroke="#E66B55" stroke-width="2"/>
 <circle class="pkt" cx="24" cy="376" r="3.5" fill="#F28A60"/>
 <text x="24" y="402" class="mono" font-size="11.5" fill="#ACAFB2">input → relevant evidence → checked output</text>
</g>
<path d="M24 422H72" stroke="#E66B55" stroke-width="3"/>
<text x="84" y="426" class="mono" font-size="10.5" letter-spacing="1.5" fill="#6F757A">FROM EVIDENCE TO SOFTWARE</text>
</svg>