<svg xmlns="http://www.w3.org/2000/svg" width="640" height="466" viewBox="0 0 640 466" role="img" aria-labelledby="title desc">
  <title id="title">Adham Elsayed — AI Engineer</title>
  <desc id="desc">Mobile editorial identity banner with an animated AI retrieval pipeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#191B1F"/><stop offset="1" stop-color="#111316"/></linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#FFFFFF" stroke-opacity=".035"/></pattern>
  </defs>
  <style>
    .sans{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,Liberation Mono,monospace}
    @keyframes flow{to{stroke-dashoffset:-64}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    .flow{animation:flow 4.5s linear infinite}
    .pulse{animation:pulse 2.8s ease-in-out infinite}
    @media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
  </style>
  <rect x="1" y="1" width="638" height="464" rx="12" fill="url(#bg)" stroke="#35383D" stroke-width="2"/>
  <path d="M24 67H616" stroke="#FFFFFF" stroke-opacity=".14"/>
  <rect x="27" y="26" width="35" height="27" rx="3" fill="#E66B55"/>
  <text x="44.5" y="45" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#111316">AE</text>
  <text x="76" y="44" class="mono" font-size="14" letter-spacing="1.2" fill="#E0DDD7">ADHAM / ENGINEERING</text>
  <text x="30" y="109" class="mono" font-size="13" letter-spacing="1.7" fill="#F07A5C">/ AI SYSTEMS ENGINEER</text>
  <text x="26" y="172" class="sans" font-size="59" font-weight="750" letter-spacing="-2.1" fill="#F4F1ED">Adham Elsayed<tspan fill="#E66B55">.</tspan></text>
  <text x="30" y="208" class="sans" font-size="19" fill="#E1DED9">Generative AI / RAG / Computer Vision</text>
  <text x="30" y="245" class="sans" font-size="17" fill="#ADB1B7">Evidence-led models, practical APIs,</text>
  <text x="30" y="269" class="sans" font-size="17" fill="#ADB1B7">reliable software.</text>
  <rect x="25" y="297" width="590" height="138" rx="7" fill="#202226" stroke="#474B51"/>
  <rect x="26" y="298" width="588" height="136" rx="6" fill="url(#grid)"/>
  <rect x="41" y="313" width="6" height="6" rx="1" fill="#E66B55" class="pulse"/>
  <text x="57" y="321" class="mono" font-size="12" letter-spacing="1.3" fill="#DDD9D4">SYSTEM / PIPELINE</text>
  <g fill="#292C31" stroke="#666A70">
    <rect x="39" y="343" width="130" height="45" rx="4"/>
    <rect x="183" y="343" width="130" height="45" rx="4"/>
    <rect x="327" y="343" width="130" height="45" rx="4"/>
    <rect x="471" y="343" width="130" height="45" rx="4" stroke="#E66B55"/>
  </g>
  <g class="mono" font-size="12" text-anchor="middle" fill="#EAE7E2">
    <text x="104" y="371">RETRIEVE</text><text x="248" y="371">RERANK</text>
    <text x="392" y="371">VERIFY</text><text x="536" y="371" fill="#FFAC91">SERVE</text>
  </g>
  <path d="M41 409H599" stroke="#64686D"/>
  <path d="M41 409H599" class="flow" stroke="#E66B55" stroke-width="3" stroke-dasharray="22 64"/>
  <text x="30" y="454" class="mono" font-size="11" letter-spacing="1.1" fill="#969DA4">RETRIEVAL / EVALUATION / DELIVERY</text>
</svg>