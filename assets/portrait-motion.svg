<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="0 0 360 300" role="img" aria-labelledby="t d">
<title id="t">Adham Elsayed portrait</title><desc id="d">Transparent portrait with a subtle floating entrance animation.</desc>
<defs>
  <radialGradient id="h"><stop stop-color="#58a6ff" stop-opacity=".18"/><stop offset=".6" stop-color="#8b5cf6" stop-opacity=".06"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></radialGradient>
  <filter id="s" x="-50%" y="-50%" width="200%" height="230%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#000" flood-opacity=".42"/></filter>
</defs>
<ellipse cx="180" cy="188" rx="118" ry="74" fill="url(#h)"><animate attributeName="opacity" values=".35;.72;.35" dur="5.8s" repeatCount="indefinite"/></ellipse>
<g opacity="0" filter="url(#s)">
  <animate attributeName="opacity" values="0;1" dur=".55s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" values="0,-20;0,0" dur=".75s" fill="freeze"/>
  <image href="data:image/webp;base64," x="62" y="4" width="236" height="292" preserveAspectRatio="xMidYMid meet"/>
  <animateTransform attributeName="transform" additive="sum" type="translate" values="0,0;0,-5;0,0" dur="4.8s" begin=".9s" repeatCount="indefinite"/>
</g>
</svg>