<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
  <title id="title">Adham Elsayed — AI Engineer</title>
  <desc id="desc">Editorial engineering identity with a subtly animated retrieval, reranking, verification, and API delivery pipeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FBF9F6"/>
      <stop offset="1" stop-color="#F0EEEA"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#E66550" stop-opacity="0"/>
      <stop offset=".5" stop-color="#F28A60" stop-opacity="1"/>
      <stop offset="1" stop-color="#E66550" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#000000" stroke-opacity=".038" stroke-width="1"/>
    </pattern>
    <clipPath id="panel"><rect x="679" y="87" width="475" height="212" rx="9"/></clipPath>
  </defs>
  <style>
    .sans{font-family:Inter,Segoe UI,Arial,sans-serif}
    .mono{font-family:SFMono-Regular,Consolas,Liberation Mono,monospace}
    @keyframes travel{to{stroke-dashoffset:-80}}
    @keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes cursor{0%,47%,52%,100%{opacity:1}49%,50%{opacity:0}}
    .travel{animation:travel 5s linear infinite}
    .signal{animation:glow 2.8s ease-in-out infinite}
    .cursor{animation:cursor 2.4s steps(1,end) infinite}
    @media (prefers-reduced-motion:reduce){.travel,.signal,.cursor{animation:none}.motion{display:none}}
  </style>
  <rect x="1" y="1" width="1198" height="368" rx="13" fill="url(#bg)" stroke="#D4CFCA" stroke-width="2"/>
  <path d="M25 61H1175" stroke="#000000" stroke-opacity=".13"/>
  <rect x="36" y="25" width="31" height="24" rx="3" fill="#C0422D"/>
  <text x="51.5" y="42" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#F0EEEA">AE</text>
  <text x="81" y="42" class="mono" font-size="12" letter-spacing="1.6" fill="#2D3137">ADHAM / ENGINEERING</text>
  <circle cx="976" cy="37" r="4" fill="#C0422D" class="signal"/>
  <text x="991" y="41" class="mono" font-size="11" letter-spacing=".8" fill="#A6A6A8">DESIGN · BUILD · VALIDATE</text>
  <text x="45" y="108" class="mono" font-size="12" font-weight="600" letter-spacing="2.1" fill="#C0422D">/  AI SYSTEMS ENGINEER</text>
  <text x="40" y="181" class="sans" font-size="66" font-weight="750" letter-spacing="-2.8" fill="#24262A">Adham Elsayed<tspan fill="#C0422D">.</tspan></text>
  <text x="44" y="219" class="sans" font-size="19" font-weight="500" fill="#33363B">Generative AI <tspan fill="#6F757A">/</tspan> RAG <tspan fill="#6F757A">/</tspan> Computer Vision</text>
  <text x="44" y="261" class="sans" font-size="16" fill="#62676E">Building the data pipelines, model logic and APIs</text>
  <text x="44" y="284" class="sans" font-size="16" fill="#62676E">that make intelligent products dependable.</text>
  <path d="M44 319H142" stroke="#C0422D" stroke-width="3"/>
  <text x="157" y="324" class="mono" font-size="10.5" letter-spacing="1.6" fill="#A3A7AC">FROM EVIDENCE TO SOFTWARE</text>
  <g clip-path="url(#panel)">
    <rect x="679" y="87" width="475" height="212" rx="9" fill="#F1EFEB"/>
    <rect x="679" y="87" width="475" height="212" fill="url(#grid)"/>
    <path d="M679 132H1154" stroke="#000000" stroke-opacity=".13"/>
    <rect x="698" y="104" width="7" height="7" rx="1.5" fill="#C0422D"/>
    <text x="718" y="111" class="mono" font-size="12" letter-spacing="1.4" fill="#31343A">SYSTEM / PIPELINE</text>
    <text x="1134" y="111" text-anchor="end" class="mono" font-size="10" fill="#92969D">v1.0</text>
    <text x="702" y="157" class="mono" font-size="11" fill="#939AA0">// evidence-grounded response</text>
    <g fill="#FFFFFF" stroke="#5A5D62" stroke-width="1">
      <rect x="699" y="178" width="100" height="43" rx="5"/>
      <rect x="809" y="178" width="100" height="43" rx="5"/>
      <rect x="919" y="178" width="100" height="43" rx="5"/>
      <rect x="1029" y="178" width="100" height="43" rx="5" stroke="#C0422D" stroke-opacity=".9"/>
    </g>
    <g class="mono" font-size="11" text-anchor="middle" fill="#31343A">
      <text x="749" y="205">RETRIEVE</text>
      <text x="859" y="205">RERANK</text>
      <text x="969" y="205">VERIFY</text>
      <text x="1079" y="205" fill="#A94430">SERVE</text>
    </g>
    <g stroke="#C0422D" stroke-opacity=".75" fill="none" stroke-width="1.5">
      <path d="M799 200H809M909 200H919M1019 200H1029"/>
    </g>
    <path d="M699 251H1129" stroke="#555A60" stroke-width="1"/>
    <path d="M699 251H1129" class="travel" stroke="#EC7656" stroke-width="2" stroke-dasharray="26 80"/>
    <circle cx="699" cy="251" r="3" fill="#C0422D" class="motion">
      <animate attributeName="cx" values="699;1129;699" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="703" y="278" class="mono" font-size="10.5" fill="#9FA5AB">input → relevant evidence → checked output</text>
    <rect x="1118" y="266" width="2" height="11" rx="1" fill="#C0422D" class="cursor"/>
  </g>
  <rect x="679" y="87" width="475" height="212" rx="9" fill="none" stroke="#D4CFCA" stroke-width="1"/>
  <text x="1154" y="339" text-anchor="end" class="mono" font-size="10" letter-spacing=".7" fill="#777E85">RETRIEVAL  /  EVALUATION  /  DELIVERY</text>
</svg>