<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc"><title id="title">Smart Basket architecture</title><desc id="desc">Camera input flows through YOLO, ONNX edge inference on Raspberry Pi 5, basket state tracking, Firebase, and a Flutter application.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101821"/><stop offset="1" stop-color="#182532"/></linearGradient></defs><rect width="1200" height="370" rx="28" fill="url(#bg)"/><text x="54" y="58" fill="#63D7C7" font-family="Consolas, monospace" font-size="18" letter-spacing="3">01 // SMART BASKET</text><text x="54" y="102" fill="#F5F8FA" font-family="Segoe UI, Arial" font-size="32" font-weight="750">Computer vision at the edge → synchronized retail state</text><g font-family="Segoe UI, Arial" text-anchor="middle"><g transform="translate(52 152)"><rect width="165" height="104" rx="18" fill="#223240"/><text x="82" y="44" fill="#C9D3DC" font-size="19" font-weight="700">Pi Camera</text><text x="82" y="72" fill="#8FA1B0" font-size="14">live frames</text></g><g transform="translate(245 152)"><rect width="165" height="104" rx="18" fill="#263746"/><text x="82" y="44" fill="#76B7F6" font-size="19" font-weight="700">YOLO</text><text x="82" y="72" fill="#8FA1B0" font-size="14">4-class detector</text></g><g transform="translate(438 152)"><rect width="165" height="104" rx="18" fill="#2B3A49"/><text x="82" y="44" fill="#AA8CFF" font-size="19" font-weight="700">ONNX / Pi 5</text><text x="82" y="72" fill="#8FA1B0" font-size="14">CPU edge inference</text></g><g transform="translate(631 152)"><rect width="165" height="104" rx="18" fill="#263746"/><text x="82" y="44" fill="#63D7C7" font-size="19" font-weight="700">Basket State</text><text x="82" y="72" fill="#8FA1B0" font-size="14">confirm · hold</text></g><g transform="translate(824 152)"><rect width="165" height="104" rx="18" fill="#223240"/><text x="82" y="44" fill="#76B7F6" font-size="19" font-weight="700">Firebase</text><text x="82" y="72" fill="#8FA1B0" font-size="14">sync on change</text></g><g transform="translate(1017 152)"><rect width="131" height="104" rx="18" fill="#263746"/><text x="65" y="44" fill="#C9D3DC" font-size="19" font-weight="700">Flutter</text><text x="65" y="72" fill="#8FA1B0" font-size="14">app layer</text></g></g><g stroke="#657C8E" stroke-width="3" fill="none"><path d="M217 204H245"/><path d="M410 204H438"/><path d="M603 204H631"/><path d="M796 204H824"/><path d="M989 204H1017"/></g><g font-family="Consolas, monospace"><rect x="54" y="290" width="250" height="48" rx="14" fill="#1D2A36"/><text x="76" y="321" fill="#63D7C7" font-size="18">mAP@0.5  96.89%</text><rect x="324" y="290" width="300" height="48" rx="14" fill="#1D2A36"/><text x="346" y="321" fill="#AA8CFF" font-size="18">mAP@0.5:0.95  84.79%</text><text x="654" y="321" fill="#8FA1B0" font-size="16">Raspberry Pi 5 · OpenCV · ONNX Runtime · Firebase</text></g></svg>