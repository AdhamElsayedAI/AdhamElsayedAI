<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc"><title id="title">MedFlow RAG and safety architecture</title><desc id="desc">Clinical documents flow through chunking, BGE embeddings, dense and sparse retrieval, evidence gating, grounded generation, citation and claim validation, and a final safety policy.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101821"/><stop offset="1" stop-color="#182532"/></linearGradient></defs><rect width="1200" height="390" rx="28" fill="url(#bg)"/><text x="54" y="56" fill="#76B7F6" font-family="Consolas, monospace" font-size="18" letter-spacing="3">02 // MEDFLOW</text><text x="54" y="100" fill="#F5F8FA" font-family="Segoe UI, Arial" font-size="31" font-weight="750">Evidence → grounded generation → safety decision</text><g font-family="Segoe UI, Arial" text-anchor="middle"><g transform="translate(44 148)"><rect width="145" height="100" rx="18" fill="#223240"/><text x="72" y="42" fill="#C9D3DC" font-size="18" font-weight="700">Documents</text><text x="72" y="69" fill="#8FA1B0" font-size="13">PDF corpus</text></g><g transform="translate(209 148)"><rect width="145" height="100" rx="18" fill="#263746"/><text x="72" y="42" fill="#63D7C7" font-size="18" font-weight="700">Chunk + BGE</text><text x="72" y="69" fill="#8FA1B0" font-size="13">384-d embeddings</text></g><g transform="translate(374 148)"><rect width="145" height="100" rx="18" fill="#2B3A49"/><text x="72" y="35" fill="#76B7F6" font-size="17" font-weight="700">Dense + BM25</text><text x="72" y="61" fill="#8FA1B0" font-size="13">ChromaDB</text><text x="72" y="80" fill="#8FA1B0" font-size="13">RRF product path</text></g><g transform="translate(539 148)"><rect width="145" height="100" rx="18" fill="#263746"/><text x="72" y="35" fill="#AA8CFF" font-size="17" font-weight="700">Evidence Gate</text><text x="72" y="61" fill="#8FA1B0" font-size="13">sufficiency</text><text x="72" y="80" fill="#8FA1B0" font-size="13">PASS / BLOCK</text></g><g transform="translate(704 148)"><rect width="145" height="100" rx="18" fill="#223240"/><text x="72" y="35" fill="#76B7F6" font-size="17" font-weight="700">Grounded LLM</text><text x="72" y="61" fill="#8FA1B0" font-size="13">structured answer</text><text x="72" y="80" fill="#8FA1B0" font-size="13">evidence IDs</text></g><g transform="translate(869 148)"><rect width="145" height="100" rx="18" fill="#263746"/><text x="72" y="35" fill="#63D7C7" font-size="17" font-weight="700">Validators</text><text x="72" y="61" fill="#8FA1B0" font-size="13">citation · claim</text><text x="72" y="80" fill="#8FA1B0" font-size="13">numeric safety</text></g><g transform="translate(1034 148)"><rect width="122" height="100" rx="18" fill="#2B3A49"/><text x="61" y="35" fill="#AA8CFF" font-size="17" font-weight="700">Policy</text><text x="61" y="61" fill="#8FA1B0" font-size="13">answer</text><text x="61" y="80" fill="#8FA1B0" font-size="13">caution / abstain</text></g></g><g stroke="#657C8E" stroke-width="3"><path d="M189 198H209"/><path d="M354 198H374"/><path d="M519 198H539"/><path d="M684 198H704"/><path d="M849 198H869"/><path d="M1014 198H1034"/></g><g font-family="Consolas, monospace"><rect x="54" y="286" width="240" height="50" rx="14" fill="#1D2A36"/><text x="76" y="318" fill="#76B7F6" font-size="18">Precision@4  53.12%</text><rect x="314" y="286" width="220" height="50" rx="14" fill="#1D2A36"/><text x="336" y="318" fill="#63D7C7" font-size="18">Hit@4  87.50%</text><rect x="554" y="286" width="180" height="50" rx="14" fill="#1D2A36"/><text x="576" y="318" fill="#AA8CFF" font-size="18">MRR  ≈0.7031</text><text x="760" y="318" fill="#8FA1B0" font-size="15">engineering benchmark · not clinical validation</text></g></svg>