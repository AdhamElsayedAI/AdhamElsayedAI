<svg xmlns="http://www.w3.org/2000/svg" width="940" height="32" viewBox="0 0 940 32" role="img" aria-labelledby="title desc"><title id="title">Engineering in progress</title><desc id="desc">A thin animated editorial line marking active work.</desc><path d="M0 20H940" fill="none" stroke="#CBD3DA" stroke-width="1"/><path d="M0 20H110" stroke="#B64D3B" stroke-width="2.5"><animate attributeName="stroke-opacity" values="1;0.55;1" dur="5s" repeatCount="indefinite"/></path><circle cy="20" r="3.3" fill="#B64D3B"><animate attributeName="cx" values="110;160;110" dur="6s" repeatCount="indefinite"/></circle><text x="940" y="12" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="10" letter-spacing="1.9" fill="#697686">ENGINEERING IN PROGRESS</text></svg>