<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">AI engineering pipeline</title>
  <desc id="desc">A six-stage pipeline flows from data to model, evaluation, serving, product, and iteration.</desc>
  <style>
    @media (prefers-color-scheme: light) {
      [fill="#111827"]{fill:#d5dfe7}[stroke="#111827"]{stroke:#c3ced7}[stop-color="#111827"]{stop-color:#d5dfe7}
      [fill="#151c26"]{fill:#f4f7f9}[stroke="#151c26"]{stroke:#dce4ea}[stop-color="#151c26"]{stop-color:#f4f7f9}
      [fill="#19222e"]{fill:#edf1f4}[stroke="#19222e"]{stroke:#d5dfe7}[stop-color="#19222e"]{stop-color:#edf1f4}
      [fill="#1d2733"]{fill:#e9eef2}[stroke="#1d2733"]{stroke:#cfd9e1}[stop-color="#1d2733"]{stop-color:#e9eef2}
      [fill="#222d3a"]{fill:#e3e9ee}[stroke="#222d3a"]{stroke:#c8d3dc}[stop-color="#222d3a"]{stop-color:#e3e9ee}
      [fill="#263241"]{fill:#dde5eb}[stroke="#263241"]{stroke:#becbd5}[stop-color="#263241"]{stop-color:#dde5eb}
      [fill="#2b3745"]{fill:#d5dfe7}[stroke="#2b3745"]{stroke:#b7c6d1}[stop-color="#2b3745"]{stop-color:#d5dfe7}
      [fill="#536575"]{fill:#71818f}[stroke="#536575"]{stroke:#cbd6df}[stop-color="#536575"]{stop-color:#cbd6df}
      [fill="#7f9caf"]{fill:#667684}[stroke="#7f9caf"]{stroke:#9aacb9}[stop-color="#7f9caf"]{stop-color:#9aacb9}
      [fill="#6ea8d9"]{fill:#5f8fb8}[stroke="#6ea8d9"]{stroke:#5f8fb8}[stop-color="#6ea8d9"]{stop-color:#5f8fb8}
      [fill="#72c7c7"]{fill:#5d9fa2}[stroke="#72c7c7"]{stroke:#5d9fa2}[stop-color="#72c7c7"]{stop-color:#5d9fa2}
      [fill="#9bc7e3"]{fill:#6f9ebc}[stroke="#9bc7e3"]{stroke:#6f9ebc}[stop-color="#9bc7e3"]{stop-color:#6f9ebc}
      [fill="#9a91c7"]{fill:#8279ab}[stroke="#9a91c7"]{stroke:#8279ab}[stop-color="#9a91c7"]{stop-color:#8279ab}
      [fill="#f3f6f8"]{fill:#202a33}[stroke="#f3f6f8"]{stroke:#202a33}
      [fill="#b8c3ce"]{fill:#43515e}[stroke="#b8c3ce"]{stroke:#43515e}
      [fill="#8493a3"]{fill:#667684}[stroke="#8493a3"]{stroke:#667684}
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151c26"/>
      <stop offset="1" stop-color="#1d2733"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2733"/>
      <stop offset="1" stop-color="#222d3a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ea8d9"/>
      <stop offset="1" stop-color="#9a91c7"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#6ea8d9" stroke-opacity="0.04"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#6ea8d9"/>
    </marker>
  </defs>

  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="560" rx="24" fill="url(#grid)"/>
  <text x="54" y="53" fill="#6ea8d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="4">ENGINEERING PIPELINE // SYSTEMS, NOT ISOLATED MODELS</text>
  <path d="M54 72H1146" stroke="#536575"/>

  <!-- Flow: top row left-to-right, then bottom row right-to-left. -->
  <g fill="none" stroke="url(#line)" stroke-width="3" marker-end="url(#arrow)">
    <path d="M350 163H432"/>
    <path d="M740 163H822"/>
    <path d="M990 220V302"/>
    <path d="M840 373H758"/>
    <path d="M450 373H368"/>
  </g>
  <g fill="#6ea8d9">
    <circle cx="390" cy="163" r="5"/><circle cx="780" cy="163" r="5"/>
    <circle cx="990" cy="260" r="5"/><circle cx="800" cy="373" r="5"/><circle cx="410" cy="373" r="5"/>
  </g>

  <!-- Six pseudo-3D process chambers. -->
  <g>
    <g transform="translate(52 104)">
      <path d="M12 14H286L298 26V126H12L0 114V26Z" fill="#151c26" stroke="#536575"/>
      <path d="M0 0H274L286 12V112H0Z" fill="url(#node)" stroke="#6ea8d9" stroke-opacity="0.72" stroke-width="2"/>
      <text x="24" y="31" fill="#8493a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">01 // INPUT</text>
      <text x="143" y="75" fill="#f3f6f8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">DATA</text>
      <text x="143" y="101" fill="#8493a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" text-anchor="middle">CURATE · PREPARE</text>
    </g>
    <g transform="translate(442 104)">
      <path d="M12 14H286L298 26V126H12L0 114V26Z" fill="#151c26" stroke="#536575"/>
      <path d="M0 0H274L286 12V112H0Z" fill="url(#node)" stroke="#6ea8d9" stroke-opacity="0.72" stroke-width="2"/>
      <text x="24" y="31" fill="#8493a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">02 // CORE</text>
      <text x="143" y="75" fill="#f3f6f8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">MODEL</text>
      <text x="143" y="101" fill="#8493a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" text-anchor="middle">TRAIN · RETRIEVE</text>
    </g>
    <g transform="translate(832 104)">
      <path d="M12 14H286L298 26V126H12L0 114V26Z" fill="#151c26" stroke="#536575"/>
      <path d="M0 0H274L286 12V112H0Z" fill="url(#node)" stroke="#9a91c7" stroke-opacity="0.72" stroke-width="2"/>
      <text x="24" y="31" fill="#8493a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">03 // PROOF</text>
      <text x="143" y="75" fill="#f3f6f8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">EVALUATE</text>
      <text x="143" y="101" fill="#8493a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" text-anchor="middle">MEASURE · FAIL</text>
    </g>

    <g transform="translate(832 314)">
      <path d="M12 14H286L298 26V126H12L0 114V26Z" fill="#151c26" stroke="#536575"/>
      <path d="M0 0H274L286 12V112H0Z" fill="url(#node)" stroke="#9a91c7" stroke-opacity="0.72" stroke-width="2"/>
      <text x="24" y="31" fill="#8493a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">04 // DELIVERY</text>
      <text x="143" y="75" fill="#f3f6f8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">SERVE</text>
      <text x="143" y="101" fill="#8493a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" text-anchor="middle">API · INFERENCE</text>
    </g>
    <g transform="translate(442 314)">
      <path d="M12 14H286L298 26V126H12L0 114V26Z" fill="#151c26" stroke="#536575"/>
      <path d="M0 0H274L286 12V112H0Z" fill="url(#node)" stroke="#6ea8d9" stroke-opacity="0.72" stroke-width="2"/>
      <text x="24" y="31" fill="#8493a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">05 // EXPERIENCE</text>
      <text x="143" y="75" fill="#f3f6f8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">PRODUCT</text>
      <text x="143" y="101" fill="#8493a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" text-anchor="middle">INTERFACE · WORKFLOW</text>
    </g>
    <g transform="translate(52 314)">
      <path d="M12 14H286L298 26V126H12L0 114V26Z" fill="#151c26" stroke="#536575"/>
      <path d="M0 0H274L286 12V112H0Z" fill="url(#node)" stroke="#6ea8d9" stroke-opacity="0.72" stroke-width="2"/>
      <text x="24" y="31" fill="#8493a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">06 // LOOP</text>
      <text x="143" y="75" fill="#f3f6f8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">ITERATE</text>
      <text x="143" y="101" fill="#8493a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" text-anchor="middle">OBSERVE · IMPROVE</text>
    </g>
  </g>

  <path d="M54 490H1146" stroke="#536575"/>
  <text x="600" y="524" fill="#8493a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" text-anchor="middle" letter-spacing="3">MODEL VALUE BEGINS AFTER THE NOTEBOOK</text>
</svg>
