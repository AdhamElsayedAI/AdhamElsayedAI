<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc"><title id="title">Code AI Proctor architecture</title><desc id="desc">Browser webcam frames flow to a FastAPI endpoint, local YOLO classification, temporal alerting, incident persistence, teacher review, and student appeal workflow.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101821"/><stop offset="1" stop-color="#182532"/></linearGradient></defs><rect width="1200" height="370" rx="28" fill="url(#bg)"/><text x="54" y="56" fill="#AA8CFF" font-family="Consolas, monospace" font-size="18" letter-spacing="3">03 // CODE AI PROCTOR</text><text x="54" y="100" fill="#F5F8FA" font-family="Segoe UI, Arial" font-size="31" font-weight="750">Visual inference connected to an auditable exam workflow</text><g font-family="Segoe UI, Arial" text-anchor="middle"><g transform="translate(44 154)"><rect width="150" height="104" rx="18" fill="#223240"/><text x="75" y="43" fill="#C9D3DC" font-size="18" font-weight="700">Webcam</text><text x="75" y="72" fill="#8FA1B0" font-size="13">browser frames</text></g><g transform="translate(214 154)"><rect width="150" height="104" rx="18" fill="#263746"/><text x="75" y="43" fill="#76B7F6" font-size="18" font-weight="700">FastAPI</text><text x="75" y="72" fill="#8FA1B0" font-size="13">/api/predict</text></g><g transform="translate(384 154)"><rect width="150" height="104" rx="18" fill="#2B3A49"/><text x="75" y="36" fill="#AA8CFF" font-size="18" font-weight="700">YOLO Classifier</text><text x="75" y="61" fill="#8FA1B0" font-size="13">cheating / normal</text><text x="75" y="80" fill="#8FA1B0" font-size="13">local PyTorch/CUDA</text></g><g transform="translate(554 154)"><rect width="150" height="104" rx="18" fill="#263746"/><text x="75" y="36" fill="#63D7C7" font-size="18" font-weight="700">Temporal Logic</text><text x="75" y="61" fill="#8FA1B0" font-size="13">batch confidence</text><text x="75" y="80" fill="#8FA1B0" font-size="13">streak stability</text></g><g transform="translate(724 154)"><rect width="150" height="104" rx="18" fill="#223240"/><text x="75" y="36" fill="#76B7F6" font-size="18" font-weight="700">Incident Log</text><text x="75" y="61" fill="#8FA1B0" font-size="13">snapshot</text><text x="75" y="80" fill="#8FA1B0" font-size="13">SQLAlchemy</text></g><g transform="translate(894 154)"><rect width="150" height="104" rx="18" fill="#263746"/><text x="75" y="36" fill="#63D7C7" font-size="18" font-weight="700">Teacher Review</text><text x="75" y="61" fill="#8FA1B0" font-size="13">notifications</text><text x="75" y="80" fill="#8FA1B0" font-size="13">grades / acknowledge</text></g><g transform="translate(1064 154)"><rect width="92" height="104" rx="18" fill="#2B3A49"/><text x="46" y="43" fill="#AA8CFF" font-size="17" font-weight="700">Appeal</text><text x="46" y="72" fill="#8FA1B0" font-size="12">student</text></g></g><g stroke="#657C8E" stroke-width="3"><path d="M194 206H214"/><path d="M364 206H384"/><path d="M534 206H554"/><path d="M704 206H724"/><path d="M874 206H894"/><path d="M1044 206H1064"/></g><text x="54" y="322" fill="#8FA1B0" font-family="Consolas, monospace" font-size="16">YOLO11n-cls / YOLO26n · FastAPI · SQLAlchemy · role-based exam flow · incident review</text></svg>