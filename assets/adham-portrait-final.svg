<svg xmlns="http://www.w3.org/2000/svg" width="420" height="390" viewBox="0 0 420 390" role="img" aria-labelledby="t d">
<title id="t">Adham Elsayed portrait</title><desc id="d">Exact professional portrait in a restrained animated glass depth frame.</desc>
<defs>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#58a6ff"/><stop offset=".55" stop-color="#7c3aed"/><stop offset="1" stop-color="#2ea043"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#58a6ff" stop-opacity=".22"/><stop offset=".6" stop-color="#7c3aed" stop-opacity=".08"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></radialGradient>
 <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".2"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <filter id="shadow" x="-50%" y="-50%" width="200%" height="220%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".5"/></filter>
 <clipPath id="photo"><rect x="75" y="48" width="270" height="270" rx="28"/></clipPath>
 <clipPath id="glass"><rect x="62" y="34" width="296" height="302" rx="36"/></clipPath>
</defs>
<ellipse cx="210" cy="190" rx="160" ry="132" fill="url(#halo)"><animate attributeName="opacity" values=".45;.85;.45" dur="5.8s" repeatCount="indefinite"/></ellipse>
<g opacity=".75"><animateTransform attributeName="transform" type="rotate" values="-4 210 185;-2 210 185;-4 210 185" dur="8s" repeatCount="indefinite"/><rect x="54" y="30" width="312" height="310" rx="39" fill="#070b11" stroke="#7c3aed" stroke-opacity=".34"/></g>
<g opacity=".8"><animateTransform attributeName="transform" type="rotate" values="3 210 185;1 210 185;3 210 185" dur="8s" repeatCount="indefinite"/><rect x="60" y="34" width="300" height="304" rx="37" fill="#101720" stroke="#2ea043" stroke-opacity=".25"/></g>
<g filter="url(#shadow)"><animateTransform attributeName="transform" type="translate" values="0 2;0 -3;0 2" dur="6s" repeatCount="indefinite"/>
 <rect x="62" y="34" width="296" height="302" rx="36" fill="#111820" stroke="url(#edge)" stroke-width="2"/>
 <rect x="70" y="42" width="280" height="286" rx="31" fill="#0d1117" stroke="#fff" stroke-opacity=".08"/>
 <image href="data:image/jpeg;base64," x="60" y="38" width="300" height="300" preserveAspectRatio="xMidYMid slice" clip-path="url(#photo)"/>
 <rect x="75" y="48" width="270" height="270" rx="28" fill="none" stroke="#fff" stroke-opacity=".16"/>
</g>
<g clip-path="url(#glass)"><rect x="-100" y="22" width="70" height="330" transform="skewX(-18)" fill="url(#shine)"><animate attributeName="x" values="-100;500" dur="7.4s" repeatCount="indefinite"/></rect></g>
<circle cx="85" cy="355" r="4" fill="#58a6ff"><animate attributeName="opacity" values=".3;1;.3" dur="2.2s" repeatCount="indefinite"/></circle>
<rect x="100" y="353" width="220" height="3" rx="1.5" fill="url(#edge)" opacity=".72"/>
<text x="210" y="377" text-anchor="middle" fill="#8b949e" font-family="SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="2">IDENTITY · ADHAM ELSAYED</text>
</svg>