<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" role="img" aria-labelledby="title desc">
  <title id="title">Adham Elsayed — AI Engineer</title>
  <desc id="desc">A six-layer perspective tunnel converges on Adham Elsayed's AI engineering identity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040812"/>
      <stop offset="0.52" stop-color="#081425"/>
      <stop offset="1" stop-color="#0b1d31"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f" stop-opacity="0.99"/>
      <stop offset="0.55" stop-color="#0b192a" stop-opacity="0.99"/>
      <stop offset="1" stop-color="#122941" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="ceilingFalloff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a6384" stop-opacity="0.24"/>
      <stop offset="0.66" stop-color="#0c2439" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#07111f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floorFalloff" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#02050a" stop-opacity="0.72"/>
      <stop offset="0.68" stop-color="#07111f" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2ed9ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#30d8ff" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#63e6ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#dffbff" stop-opacity="0.34"/>
      <stop offset="0.2" stop-color="#46ddff" stop-opacity="0.2"/>
      <stop offset="0.58" stop-color="#317dff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#317dff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#80dfff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="panelShadow" x="-20%" y="-35%" width="140%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#01040a" flood-opacity="0.82"/>
      <feDropShadow dx="0" dy="-2" stdDeviation="5" flood-color="#3bdcff" flood-opacity="0.18"/>
    </filter>
    <clipPath id="screenClip">
      <path d="M398 187H1102L1130 215V405L1102 433H398L370 405V215Z"/>
    </clipPath>
  </defs>

  <rect width="1500" height="620" rx="28" fill="url(#bg)"/>
  <rect width="1500" height="620" rx="28" fill="url(#grid)"/>

  <!-- Six receding architectural layers create the inward tunnel. -->
  <g fill="none">
    <path d="M28 28H1472V592H28Z" stroke="#45627f" stroke-opacity="0.62" stroke-width="2"/>
    <path d="M88 58H1412V562H88Z" stroke="#38d9ff" stroke-opacity="0.3" stroke-width="2"/>
    <path d="M158 92H1342V528H158Z" stroke="#6486a8" stroke-opacity="0.45" stroke-width="2"/>
    <path d="M232 126H1268V494H232Z" stroke="#5b8cff" stroke-opacity="0.37" stroke-width="2"/>
    <path d="M304 156H1196V464H304Z" stroke="#6994b5" stroke-opacity="0.42" stroke-width="2"/>
    <path d="M365 181H1135V439H365Z" stroke="#39dcff" stroke-opacity="0.55" stroke-width="2"/>
  </g>

  <!-- Faceted tunnel walls. -->
  <g>
    <path d="M28 28H1472L1412 58H88Z" fill="#18314a" fill-opacity="0.34"/>
    <path d="M28 592H1472L1412 562H88Z" fill="#050a13" fill-opacity="0.72"/>
    <path d="M28 28V592L88 562V58Z" fill="#0c1a2b" fill-opacity="0.72"/>
    <path d="M1472 28V592L1412 562V58Z" fill="#102943" fill-opacity="0.54"/>

    <path d="M88 58H1412L1342 92H158Z" fill="#0d2237" fill-opacity="0.66"/>
    <path d="M88 562H1412L1342 528H158Z" fill="#07101c" fill-opacity="0.76"/>
    <path d="M88 58V562L158 528V92Z" fill="#0a1727" fill-opacity="0.76"/>
    <path d="M1412 58V562L1342 528V92Z" fill="#132941" fill-opacity="0.5"/>

    <path d="M158 92H1342L1268 126H232Z" fill="#173049" fill-opacity="0.34"/>
    <path d="M158 528H1342L1268 494H232Z" fill="#07111e" fill-opacity="0.8"/>
    <path d="M158 92V528L232 494V126Z" fill="#0a1929" fill-opacity="0.72"/>
    <path d="M1342 92V528L1268 494V126Z" fill="#10263d" fill-opacity="0.5"/>

    <path d="M232 126H1268L1196 156H304Z" fill="#10263b" fill-opacity="0.58"/>
    <path d="M232 494H1268L1196 464H304Z" fill="#07111d" fill-opacity="0.82"/>
    <path d="M232 126V494L304 464V156Z" fill="#0c1c2e" fill-opacity="0.72"/>
    <path d="M1268 126V494L1196 464V156Z" fill="#102741" fill-opacity="0.46"/>

    <path d="M304 156H1196L1135 181H365Z" fill="#17344e" fill-opacity="0.28"/>
    <path d="M304 464H1196L1135 439H365Z" fill="#06101c" fill-opacity="0.86"/>
    <path d="M304 156V464L365 439V181Z" fill="#0b192a" fill-opacity="0.8"/>
    <path d="M1196 156V464L1135 439V181Z" fill="#132b45" fill-opacity="0.44"/>
  </g>

  <!-- Directional falloff separates foreground architecture from the recessed core. -->
  <path d="M0 0H1500L1135 181H365Z" fill="url(#ceilingFalloff)"/>
  <path d="M0 620H1500L1135 439H365Z" fill="url(#floorFalloff)"/>

  <!-- Converging guides and a restrained perspective floor. -->
  <g fill="none" stroke="#5cceee" stroke-opacity="0.25" stroke-width="1.5">
    <path d="M28 28L750 310L1472 28M28 592L750 310L1472 592"/>
    <path d="M88 58L750 310L1412 58M88 562L750 310L1412 562"/>
    <path d="M158 92L750 310L1342 92M158 528L750 310L1342 528"/>
  </g>
  <g fill="none" stroke="#75cde7" stroke-opacity="0.12" stroke-width="1">
    <path d="M90 562H1410M160 528H1340M232 494H1268M304 464H1196M365 439H1135"/>
    <path d="M165 592L750 310M365 592L750 310M565 592L750 310M935 592L750 310M1135 592L750 310M1335 592L750 310"/>
  </g>

  <!-- Portal ribs reinforce the same vanishing point without adding ornament. -->
  <g fill="none" stroke-linecap="round">
    <path d="M88 58L158 92M1412 58L1342 92M88 562L158 528M1412 562L1342 528" stroke="#48dcff" stroke-opacity="0.34" stroke-width="3"/>
    <path d="M232 126L304 156M1268 126L1196 156M232 494L304 464M1268 494L1196 464" stroke="#6d85ff" stroke-opacity="0.34" stroke-width="3"/>
    <path d="M332 168L370 187M1168 168L1130 187M332 452L370 433M1168 452L1130 433" stroke="#65e2ff" stroke-opacity="0.62" stroke-width="4"/>
  </g>

  <!-- Intelligence core and recessed identity plate. -->
  <circle cx="750" cy="310" r="245" fill="url(#core)"/>
  <circle cx="750" cy="310" r="104" fill="#36d9ff" fill-opacity="0.08" filter="url(#softGlow)"/>
  <path d="M410 199H1114L1143 228V418L1114 447H410L381 418V228Z" fill="#02060d" fill-opacity="0.76" filter="url(#panelShadow)"/>
  <path d="M398 187H1102L1130 215V405L1102 433H398L370 405V215Z" fill="url(#panel)" stroke="#57dfff" stroke-opacity="0.94" stroke-width="3"/>
  <path d="M414 202H1086L1114 230V390L1086 418H414L386 390V230Z" fill="none" stroke="#8292ff" stroke-opacity="0.48" stroke-width="1.5"/>
  <path d="M438 217H1062" stroke="#d6f9ff" stroke-opacity="0.18" stroke-width="2"/>
  <path d="M348 233V387M1152 233V387" stroke="#51ddff" stroke-opacity="0.42" stroke-width="3"/>
  <path d="M348 233L365 216M348 387L365 404M1152 233L1135 216M1152 387L1135 404" fill="none" stroke="#758bff" stroke-opacity="0.56" stroke-width="3"/>
  <g clip-path="url(#screenClip)" opacity="0.26">
    <path d="M370 338H1130M370 350H1130" stroke="url(#cyanLine)"/>
    <circle cx="750" cy="310" r="170" fill="none" stroke="#3bdcff" stroke-opacity="0.35"/>
    <circle cx="750" cy="310" r="132" fill="none" stroke="#7780ff" stroke-opacity="0.25"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="750" y="246" fill="#71def7" font-size="17" font-weight="600" letter-spacing="5">AI ENGINEERING NODE // 01</text>
    <text x="750" y="322" fill="#f3fbff" font-size="78" font-weight="750" letter-spacing="4">ADHAM ELSAYED</text>
    <text x="750" y="373" fill="#73e4ff" font-size="39" font-weight="650" letter-spacing="8">AI ENGINEER</text>
    <text x="750" y="405" fill="#9badc1" font-size="17" letter-spacing="3">MODEL INTELLIGENCE → WORKING SYSTEMS</text>
    <text x="750" y="486" fill="#dceaf3" font-size="31" font-weight="600" letter-spacing="3">COMPUTER VISION · RAG</text>
    <text x="750" y="522" fill="#dceaf3" font-size="31" font-weight="600" letter-spacing="3">LLM SYSTEMS · INTELLIGENT APPLICATIONS</text>
    <text x="750" y="563" fill="#7f96ab" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" letter-spacing="3">BUILD → EVALUATE → DEPLOY → IMPROVE</text>
  </g>

  <g fill="#48dfff">
    <circle cx="34" cy="310" r="4"/><circle cx="1466" cy="310" r="4"/>
    <circle cx="750" cy="28" r="4"/><circle cx="750" cy="592" r="4"/>
  </g>
</svg>
