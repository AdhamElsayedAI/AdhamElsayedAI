<rect x="36" y="25" width="31" height="24" rx="3" fill="#E66B55"/>
<text x="51.5" y="42" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#111316">AE</text>
<text x="81" y="42" class="mono" font-size="12" letter-spacing="1.6" fill="#E1DED9">ADHAM / ENGINEERING</text>
<circle class="ring" cx="976" cy="37" r="4" fill="#E66B55"/>
<circle class="dot" cx="976" cy="37" r="4" fill="#E66B55"/>
<text x="991" y="41" class="mono" font-size="11" letter-spacing=".8" fill="#ACAFB2">DESIGN · BUILD · VALIDATE</text>

<text class="mono in1" x="45" y="112" font-size="12" font-weight="600" letter-spacing="2.1" fill="#F28A60">/  AI SYSTEMS ENGINEER</text>
<text class="sans in2" x="40" y="190" font-size="68" font-weight="750" letter-spacing="-2.8" fill="#F4F1ED">Adham Elsayed<tspan fill="#E66B55">.</tspan></text>
<g class="sans" font-size="20" font-weight="500" fill="#E1DED9">
 <text class="r r1" x="44" y="232">Generative AI <tspan fill="#6F757A">/</tspan> RAG <tspan fill="#6F757A">/</tspan> Computer Vision</text>
 <text class="r r2" x="44" y="232">Hybrid retrieval <tspan fill="#6F757A">·</tspan> reranking <tspan fill="#6F757A">·</tspan> grounding</text>
 <text class="r r3" x="44" y="232">FastAPI <tspan fill="#6F757A">·</tspan> ONNX Runtime <tspan fill="#6F757A">·</tspan> edge deployment</text>
</g>
<g fill="#FFFFFF" fill-opacity=".18"><rect x="44" y="247" width="16" height="2"/><rect x="66" y="247" width="16" height="2"/><rect x="88" y="247" width="16" height="2"/></g>
<g fill="#E66B55"><rect class="i i1" x="44" y="247" width="16" height="2"/><rect class="i i2" x="66" y="247" width="16" height="2"/><rect class="i i3" x="88" y="247" width="16" height="2"/></g>
<g class="sans in3" font-size="16" fill="#ACAFB2"><text x="44" y="287">Building the data pipelines, model logic and APIs</text><text x="44" y="310">that make intelligent products dependable.</text></g>
<path d="M44 348H142" stroke="#E66B55" stroke-width="3"/>
<text x="157" y="352" class="mono" font-size="10.5" letter-spacing="1.6" fill="#ACAFB2">FROM EVIDENCE TO SOFTWARE</text>

