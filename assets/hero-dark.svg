<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700" role="img" aria-labelledby="title desc">
<title id="title">Adham Elsayed — AI Engineer</title>
<desc id="desc">A cinematic three-dimensional AI engineering chamber with a floating identity panel and subtle motion.</desc>
<defs>
