<radialGradient id="heroAmbient" cx=".51" cy=".46" r=".70" fx=".51" fy=".46"><stop offset="0" stop-color="#141A23" stop-opacity=".92"/><stop offset=".54" stop-color="#11161E" stop-opacity=".80"/><stop offset=".86" stop-color="#11161E" stop-opacity=".29"/><stop offset="1" stop-color="#11161E" stop-opacity="0"/></radialGradient><radialGradient id="ambientRight" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F0795A" stop-opacity=".20"/><stop offset=".5" stop-color="#F0795A" stop-opacity=".08"/><stop offset="1" stop-color="#F0795A" stop-opacity="0"/></radialGradient><linearGradient id="glassPanel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#465366" stop-opacity=".29"/><stop offset=".28" stop-color="#202833" stop-opacity=".68"/><stop offset="1" stop-color="#171C25" stop-opacity=".86"/></linearGradient><linearGradient id="glassHighlight" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".52"/><stop offset=".35" stop-color="#FFFFFF" stop-opacity=".10"/><stop offset=".75" stop-color="#F0795A" stop-opacity=".10"/><stop offset="1" stop-color="#F0795A" stop-opacity=".54"/></linearGradient><linearGradient id="glassReflection" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".24"/><stop offset=".28" stop-color="#FFFFFF" stop-opacity=".055"/><stop offset=".48" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient><linearGradient id="nodeGlass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#485363" stop-opacity=".38"/><stop offset="1" stop-color="#171C25" stop-opacity=".60"/></linearGradient><linearGradient id="headerFade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".1" stop-color="#FFFFFF" stop-opacity=".14"/><stop offset=".75" stop-color="#FFFFFF" stop-opacity=".12"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient><linearGradient id="arcFade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F0795A" stop-opacity="0"/><stop offset=".45" stop-color="#F0795A" stop-opacity=".32"/><stop offset="1" stop-color="#F0795A" stop-opacity="0"/></linearGradient><radialGradient id="gridFade" cx=".54" cy=".52" r=".67"><stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/><stop offset=".66" stop-color="#FFFFFF" stop-opacity=".55"/><stop offset="1" stop-color="#000000" stop-opacity="0"/></radialGradient><mask id="gridMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="400"><rect x="0" y="0" width="1200" height="400" fill="url(#gridFade)"/></mask><filter id="glassShadow" x="-.2" y="-.3" width="1.4" height="1.6" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="11"/></filter></defs>
<rect x="0" y="0" width="1200" height="400" fill="url(#heroAmbient)"/><g aria-hidden="true"><ellipse cx="840" cy="155" rx="460" ry="225" fill="url(#ambientRight)"/><path d="M-100 270 C180 -110 380 -95 700 22" stroke="url(#arcFade)" stroke-width="1.4" fill="none" opacity=".46"/></g><g clip-path="url(#cc)">
 <rect class="grid" x="-24" y="-24" width="1248" height="448" fill="url(#gp)" mask="url(#gridMask)" opacity=".42"/>
