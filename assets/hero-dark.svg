<text x="969.0" y="215.5" text-anchor="middle" class="mono" font-size="11" letter-spacing=".6" fill="#E1DED9">VERIFY</text>
<rect x="1029" y="190" width="100" height="43" rx="5" fill="#292C31" stroke="#5A5D62"/>
<rect class="hl h3" x="1029" y="190" width="100" height="43" rx="5" fill="#E66B55" fill-opacity=".2" stroke="#E66B55"/>
