<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Adham AI identity console</title>
  <desc id="desc">A recessed terminal identifies Adham Elsayed as an AI Engineer in Egypt and shows his engineering approach.</desc>
  <style>
    @media (prefers-color-scheme: light) {
      [fill="#111827"]{fill:#d5dfe7}[stroke="#111827"]{stroke:#c3ced7}[stop-color="#111827"]{stop-color:#d5dfe7}
      [fill="#151c26"]{fill:#f4f7f9}[stroke="#151c26"]{stroke:#dce4ea}[stop-color="#151c26"]{stop-color:#f4f7f9}
