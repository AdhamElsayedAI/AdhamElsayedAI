      [fill="#536575"]{fill:#71818f}[stroke="#536575"]{stroke:#cbd6df}[stop-color="#536575"]{stop-color:#cbd6df}
      [fill="#7f9caf"]{fill:#667684}[stroke="#7f9caf"]{stroke:#9aacb9}[stop-color="#7f9caf"]{stop-color:#9aacb9}
      [fill="#6ea8d9"]{fill:#5f8fb8}[stroke="#6ea8d9"]{stroke:#5f8fb8}[stop-color="#6ea8d9"]{stop-color:#5f8fb8}
      [fill="#72c7c7"]{fill:#5d9fa2}[stroke="#72c7c7"]{stroke:#5d9fa2}[stop-color="#72c7c7"]{stop-color:#5d9fa2}
      [fill="#9bc7e3"]{fill:#6f9ebc}[stroke="#9bc7e3"]{stroke:#6f9ebc}[stop-color="#9bc7e3"]{stop-color:#6f9ebc}
      [fill="#9a91c7"]{fill:#8279ab}[stroke="#9a91c7"]{stroke:#8279ab}[stop-color="#9a91c7"]{stop-color:#8279ab}
      [fill="#f3f6f8"]{fill:#202a33}[stroke="#f3f6f8"]{stroke:#202a33}
      [fill="#b8c3ce"]{fill:#43515e}[stroke="#b8c3ce"]{stroke:#43515e}
      [fill="#8493a3"]{fill:#667684}[stroke="#8493a3"]{stroke:#667684}
    }
  </style>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19222e"/>
      <stop offset="1" stop-color="#1d2733"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151c26"/>
      <stop offset="1" stop-color="#19222e"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ea8d9" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#6ea8d9" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#9a91c7" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 7.5H8" stroke="#6ea8d9" stroke-opacity="0.025"/>
    </pattern>
  </defs>

  <rect width="1200" height="500" rx="24" fill="#151c26"/>
  <path d="M44 30H1156L1180 54V446L1156 470H44L20 446V54Z" fill="url(#shell)" stroke="#536575" stroke-width="2"/>
  <path d="M62 64H1138L1152 78V422L1138 436H62L48 422V78Z" fill="url(#screen)" stroke="url(#edge)" stroke-width="2"/>
  <path d="M20 54L48 78V422L20 446M1180 54L1152 78V422L1180 446" fill="none" stroke="#7f9caf" stroke-opacity="0.5"/>
  <rect x="48" y="78" width="1104" height="358" fill="url(#scan)"/>

  <path d="M48 124H1152" stroke="#536575"/>
  <circle cx="79" cy="101" r="7" fill="#c78386"/><circle cx="103" cy="101" r="7" fill="#c6a866"/><circle cx="127" cy="101" r="7" fill="#78ad91"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="86" y="174" fill="#72c7c7" font-size="30">adham@ai-core:~$ <tspan fill="#f3f6f8">whoami</tspan></text>
    <text x="112" y="224" fill="#b8c3ce" font-size="35" font-weight="700">&gt; AI Engineer // Egypt</text>
    <text x="112" y="270" fill="#b8c3ce" font-size="28">&gt; Computer Vision · RAG · LLM Systems</text>
    <text x="112" y="312" fill="#b8c3ce" font-size="28">&gt; Intelligent Applications</text>

    <text x="86" y="365" fill="#72c7c7" font-size="30">adham@ai-core:~$ <tspan fill="#f3f6f8">approach</tspan></text>
    <text x="112" y="414" fill="#b8c3ce" font-size="29" font-weight="650">DATA → MODEL → EVALUATE → SERVE → PRODUCT → ITERATE</text>
  </g>

  <path d="M112 438H1088" stroke="url(#edge)" stroke-opacity="0.55"/>
