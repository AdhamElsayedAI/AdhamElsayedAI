      [fill="#222d3a"]{fill:#e3e9ee}[stroke="#222d3a"]{stroke:#c8d3dc}[stop-color="#222d3a"]{stop-color:#e3e9ee}
      [fill="#263241"]{fill:#dde5eb}[stroke="#263241"]{stroke:#becbd5}[stop-color="#263241"]{stop-color:#dde5eb}
