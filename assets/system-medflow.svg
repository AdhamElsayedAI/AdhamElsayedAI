  <g transform="translate(496 68)"><rect width="130" height="82" rx="12" fill="#fff" stroke="#1a7f37"/><text x="65" y="32" fill="#24292f" font-size="14" font-weight="700">Evidence gate</text><text x="65" y="54" fill="#57606a" font-size="11">PASS / BLOCK</text></g>
  <g transform="translate(646 68)"><rect width="130" height="82" rx="12" fill="#fff" stroke="#d0d7de"/><text x="65" y="32" fill="#24292f" font-size="14" font-weight="700">Grounded LLM</text><text x="65" y="54" fill="#57606a" font-size="11">structured output</text></g>
