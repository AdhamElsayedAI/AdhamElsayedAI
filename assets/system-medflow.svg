  <g transform="translate(26 68)"><rect width="130" height="82" rx="12" fill="#fff" stroke="#d0d7de"/><text x="65" y="35" fill="#24292f" font-size="14" font-weight="700">Documents</text><text x="65" y="57" fill="#57606a" font-size="11">PDF corpus</text></g>
